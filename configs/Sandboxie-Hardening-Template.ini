# ==============================================================================
# AegisBlackout Reference Sandboxie-Plus Hardening Profile
# ==============================================================================
# Pair AegisBlackout (24x7 Host GPU HW-DRM + WDA_MONITOR Curtain) with an
# isolated Sandboxie-Plus container for untrusted desktop IM / Electron /
# Chromium clients that aggressively invoke per-window PrintWindow / WGC or
# enumerate host user directories.
#
# HOW TO USE:
#   1. Replace <YOUR_USER>, <AEGIS_INSTALL_DIR>, and <APP_INSTALL_DIR>.
#   2. Merge [IsolatedIMBox] into your Sandboxie.ini and reload drivers.
# ==============================================================================

[IsolatedIMBox]
Enabled=y
ConfigLevel=10
AutoRecover=n
BlockNetworkFiles=y
BorderColor=#00FF00,ttl
DropAdminRights=y
OpenClipboard=y

# Core Templates
Template=OpenBluetooth
Template=SkipHook
Template=FileCopy
Template=qWave
Template=BlockPorts
Template=AutoRecoverIgnore
Template=LingerPrograms

# Optional: Force target app folder into this sandbox automatically
# ForceFolder=<APP_INSTALL_DIR>

# Electron / Chromium child-process compatibility inside hardened sandbox
# SpecialImage=chrome,YourChatClient.exe

# Anti-Screen-Capture & Privacy Hardening
BlockScreenCapture=y
HideNonSystemProcesses=y
HideOtherBoxes=y
HideSbieProcesses=y
HideDiskSerialNumber=y
HideNetworkAdapterMAC=y
RandomRegUID=y

# Allow minimal local storage strictly inside user profile container
WriteFilePath=C:\Users\<YOUR_USER>\
WriteFilePath=C:\Users\Public\Desktop\
WriteFilePath=C:\Users\Public\Documents\
WriteFilePath=C:\Users\Public\Downloads\
WriteFilePath=C:\Users\Public\Pictures\

# Protect AegisBlackout installation directory from sandboxed inspection
ClosedFilePath=<AEGIS_INSTALL_DIR>\

# Ring-0 DLL Lockdown: Block Windows modern capture & magnification libraries
ClosedFilePath=C:\Windows\System32\Magnification.dll
ClosedFilePath=C:\Windows\SysWOW64\Magnification.dll
ClosedFilePath=C:\Windows\System32\GraphicsCapture.dll
ClosedFilePath=C:\Windows\SysWOW64\GraphicsCapture.dll
ClosedFilePath=C:\Windows\System32\CaptureService.dll
ClosedFilePath=C:\Windows\SysWOW64\CaptureService.dll
ClosedFilePath=C:\Windows\System32\Windows.Internal.CapturePicker.dll
ClosedFilePath=C:\Windows\System32\Windows.Internal.CapturePicker.Desktop.dll

# Block secondary volumes & sensitive host directories as needed:
# ClosedFilePath=E:\
# ClosedFilePath=F:\
# ClosedFilePath=C:\SensitiveWorkspace\

# Block built-in IM client screenshot, screen-recording, D3D hook & remote-control modules:
# NOTE: Always use wildcard suffix `*` under versioned subdirectories!
# ClosedFilePath=<APP_INSTALL_DIR>\versions\*\resources\app\Screenshot\*
# ClosedFilePath=<APP_INSTALL_DIR>\ScreenshotTool.exe
# ClosedFilePath=<APP_INSTALL_DIR>\screen_recorder.dll
# ClosedFilePath=<APP_INSTALL_DIR>\d3d_hook_x64.dll
# ClosedFilePath=<APP_INSTALL_DIR>\remote_control_host.exe
